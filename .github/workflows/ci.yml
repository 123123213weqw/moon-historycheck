name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit (pinned release asset)
        run: |
          mkdir -p "$HOME/.moon"
          curl -fsSL https://github.com/123123213weqw/moon-historycheck/releases/download/toolchain-0.1.20261104/moonbit-0.1.20261104-linux-x86_64.tar.gz \
            | tar xz -C "$HOME/.moon"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit (pinned release asset)
        run: |
          mkdir -p "$HOME/.moon"
          curl -fsSL https://github.com/123123213weqw/moon-historycheck/releases/download/toolchain-0.1.20261104/moonbit-0.1.20261104-linux-x86_64.tar.gz \
            | tar xz -C "$HOME/.moon"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version
      - run: moon update
      - run: moon fmt --check
      - run: moon info && git diff --exit-code -- '*.mbti'
      - run: python -B scripts/fixtures.py --check
      - run: moon build --target js
      - run: node scripts/check.mjs
      - run: python -B scripts/robustness.py
      - run: python -B scripts/coverage.py
      - run: python -B scripts/fuzz.py 3
      - run: python -B scripts/gate.py
      - run: python -B scripts/reference.py
      - run: python -B scripts/proof_reference.py
      - run: python -B scripts/scale.py
      - run: node scripts/record-demo.mjs "$RUNNER_TEMP/historycheck-recorded"
      - run: python -B scripts/stats.py
